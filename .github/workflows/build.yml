name: Build Right100

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Setup keystore
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          cat > keystore.properties << PROPS
          storeFile=${{ github.workspace }}/release.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          PROPS

      - name: Build FOSS release APK
        run: ./gradlew assembleFossRelease --stacktrace

      - name: Get version
        id: ver
        run: |
          VERSION_NAME=$(grep "^VERSION_NAME" gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/Right100-${{ steps.ver.outputs.version }}.apk \;
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Right100-apk
          path: out/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Right100 v${{ steps.ver.outputs.version }}
          body: |
            Build automático do Right100.
            Versão ${{ steps.ver.outputs.version }}.
          files: out/*.apk
          make_latest: true
